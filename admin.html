<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLOBAL MARKET 관리자</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;padding:18px}h1{margin:0 0 16px}h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#111c2f;border:1px solid #263650;border-radius:14px;padding:15px;margin-bottom:14px}.stat{background:#0b1424;border-radius:10px;padding:12px;text-align:center}.stat small{display:block;color:#8fa1bb}.stat strong{font-size:20px;display:block;margin-top:5px}button,input,select{font:inherit}button{border:0;border-radius:9px;padding:10px 13px;margin:3px;cursor:pointer;background:#334155;color:white;font-weight:700}button.primary{background:#2563eb}button.green{background:#16a34a}button.red{background:#dc2626}button.orange{background:#d97706}input,select{background:#0b1424;color:#e5e7eb;border:1px solid #334155;border-radius:9px;padding:10px;width:100%;margin:3px 0}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.player{background:#0b1424;border:1px solid #263650;border-radius:10px;padding:11px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#8fa1bb;font-size:12px}.tablewrap{overflow:auto;max-height:430px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px;border-bottom:1px solid #263650;text-align:left;white-space:nowrap}.canvaswrap{height:300px;position:relative}.hidden{display:none!important}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#243552;font-size:11px;margin:2px}.news{padding:8px;background:#0b1424;border-radius:8px;margin:5px 0;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid,.filters,.split{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.players{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login">
<h1>GLOBAL MARKET 관리자</h1><div class="card"><input id="code" type="password" maxlength="10" placeholder="관리자 코드"><button class="primary" id="loginBtn" style="width:100%">관리자 로그인</button><p id="err" class="muted"></p></div>
</div>
<div id="app" class="hidden">
<h1>🌍 GLOBAL MARKET 관리자</h1>
<div class="grid"><div class="stat"><small>현재 턴</small><strong id="turn">-</strong></div><div class="stat"><small>남은 시간</small><strong id="time">--:--</strong></div><div class="stat"><small>참가자</small><strong id="count">0</strong></div><div class="stat"><small>상태</small><strong id="status">대기</strong></div></div>
<div class="card"><h2>게임 제어</h2><button class="green" id="next">▶ 다음 턴</button><button class="orange" id="pause">⏸ 중지</button><button class="green" id="resume">▶ 재개</button><button class="red" id="reset">🔄 초기화</button></div>
<div class="split"><div class="card"><h2>현재 턴 뉴스 <span class="pill">정확히 14개</span></h2><div id="news"></div></div><div class="card"><h2>시장 그래프</h2><div class="row"><select id="country"></select><select id="stock"></select></div><button id="stockGraph">종목 그래프</button><button id="countryGraph">국가 비교 그래프</button><div class="canvaswrap"><canvas id="marketChart"></canvas></div></div></div>
<div class="card"><h2>플레이어별 자산 그래프</h2><input id="playerSearch" placeholder="닉네임 검색"><div id="players" class="players"></div><div class="canvaswrap"><canvas id="playerChart"></canvas></div><p id="selectedPlayer" class="muted">플레이어를 선택하면 자산 변동 그래프가 표시됩니다.</p></div>
<div class="card"><h2>거래내역 <span class="pill">실시간</span></h2><div class="filters"><input id="fNick" placeholder="닉네임"><input id="fCountry" placeholder="국가"><input id="fStock" placeholder="종목"><select id="fAction"><option value="">전체 거래</option><option value="buy">매수</option><option value="sell">매도</option></select><input id="fTurn" type="number" min="1" max="12" placeholder="턴"></div><button class="primary" id="filterBtn">조회</button><div class="tablewrap"><table class="table"><thead><tr><th>시간</th><th>턴</th><th>닉네임</th><th>국가</th><th>종목</th><th>구분</th><th>수량</th><th>가격</th><th>거래금액</th></tr></thead><tbody id="tx"></tbody></table></div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();let auth=false,state=null,players=[],selected=null;
const $=id=>document.getElementById(id); const money=n=>'₩'+Math.floor(n||0).toLocaleString('ko-KR');
function time(ms){let s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
$('loginBtn').onclick=()=>socket.emit('adminLogin',{code:$('code').value.trim()});$('code').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};
socket.on('adminAuth',d=>{if(d.success){auth=true;$('login').classList.add('hidden');$('app').classList.remove('hidden')}else $('err').textContent=d.message||'인증 실패'});
socket.on('adminState',d=>{state=d;players=d.players||[];$('turn').textContent=d.turn?`${d.turn}월`: '시작 전';$('time').textContent=time(d.remainingMs);$('count').textContent=d.playerCount||0;$('status').textContent={waiting:'대기',running:'진행중',paused:'중지',finished:'종료'}[d.status]||d.status;renderNews(d.news||[]);renderPlayers();fillMarkets();});
socket.on('timer',d=>{if(auth)$('time').textContent=time(d.remainingMs)});
function renderNews(ns){$('news').innerHTML=ns.map(n=>`<div class="news"><b>#${n.id} ${n.title}</b><div class="muted">관련: ${(n.relatedStocks||[]).join(', ')}</div></div>`).join('')||'<p class="muted">뉴스 없음</p>'}
function renderPlayers(){let q=$('playerSearch').value.trim().toLowerCase();let ps=players.filter(p=>p.nickname.toLowerCase().includes(q));$('players').innerHTML=ps.map(p=>`<div class="player"><div class="row"><b>${p.nickname}</b><button class="primary" onclick="selectPlayer('${p.id}')">그래프</button></div><div class="muted">현금 ${money(p.cash)} · 총자산 ${money(p.total)} · 보유 ${Object.keys(p.holdings||{}).length}종목</div><div><span class="pill">해금 ${p.unlockedNews?.length||0}</span><span class="pill">오답 ${p.failedNews?.length||0}</span><span class="pill">사회 ${p.socialPoints||0}</span></div></div>`).join('')||'<p class="muted">참가자 없음</p>'}
$('playerSearch').oninput=renderPlayers;
window.selectPlayer=id=>{selected=id;socket.emit('getPlayerHistory',{playerId:id})};
socket.on('playerHistory',d=>{ $('selectedPlayer').textContent=`${d.player.nickname} · 총자산 ${money(d.player.total)} · 거래 ${d.transactions.length}건`; drawLine($('playerChart'),[d.history.map(x=>x.assets)],['총자산'],false)});
function fillMarkets(){if(!state)return;let codes=Object.keys({KR:1,JP:1,US:1,CN:1,DE:1,FR:1,IN:1,SA:1,AE:1,BR:1});if(!$('country').options.length){$('country').innerHTML=codes.map(c=>`<option>${c}</option>`).join('');}let code=$('country').value;let map={KR:['K-CHIP','K-MOTOR','K-FOOD','K-BATTERY','K-CONTENT'],JP:['J-AUTO','J-ELEC','J-GAME','J-PRECISE','J-FOOD'],US:['US-IT','US-BIO','US-FIN','US-CONTENT','US-AUTO'],CN:['CN-ELEC','CN-BATTERY','CN-MANU','CN-PLATFORM','CN-FOOD'],DE:['DE-AUTO','DE-CHEM','DE-MACH','DE-GREEN','DE-FOOD'],FR:['FR-LUX','FR-COSME','FR-FOOD','FR-TOUR','FR-AIR'],IN:['IN-IT','IN-PHARMA','IN-AUTO','IN-FOOD','IN-ENERGY'],SA:['SA-OIL','SA-PETRO','SA-ENERGY','SA-CONST','SA-TOUR'],AE:['AE-OIL','AE-LOGIS','AE-FIN','AE-TOUR','AE-CONST'],BR:['BR-AGRI','BR-FOOD','BR-MINING','BR-ENERGY','BR-AIR']};let cur=$('stock').value;$('stock').innerHTML=map[code].map(x=>`<option>${x}</option>`).join('');if(map[code].includes(cur))$('stock').value=cur}
$('country').onchange=fillMarkets;
function drawLine(canvas,series,names,normalize=true){let ctx=canvas.getContext('2d'),w=canvas.width=canvas.clientWidth*2,h=canvas.height=canvas.clientHeight*2;ctx.clearRect(0,0,w,h);if(!series.length||series[0].length<2){ctx.fillStyle='#8fa1bb';ctx.font='28px sans-serif';ctx.fillText('데이터가 부족합니다',30,60);return}let all=series.flat(),min=Math.min(...all),max=Math.max(...all);if(normalize){series=series.map(a=>{let b=a[0]||1;return a.map(v=>v/b*100)});min=Math.min(...series.flat());max=Math.max(...series.flat())}let range=max-min||1;series.forEach((a,j)=>{ctx.strokeStyle=`hsl(${j*67%360},70%,65%)`;ctx.lineWidth=5;ctx.beginPath();a.forEach((v,i)=>{let x=45+i/(a.length-1)*(w-70),y=h-50-(v-min)/range*(h-90);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.font='22px sans-serif';ctx.fillText(names[j]||'',50+j*150,28)});}
$('stockGraph').onclick=()=>socket.emit('getPriceHistory',{stock:$('stock').value});$('countryGraph').onclick=()=>socket.emit('getCountryHistory',{country:$('country').value});
socket.on('priceHistory',d=>{drawLine($('marketChart'),[d.history],[d.stock],false)});socket.on('countryHistory',d=>{drawLine($('marketChart'),d.stocks.map(x=>x.values),d.stocks.map(x=>x.stock),true)});
function loadTx(){socket.emit('getTransactions',{nickname:$('fNick').value.trim(),country:$('fCountry').value.trim(),stock:$('fStock').value.trim(),action:$('fAction').value,turn:$('fTurn').value})}$('filterBtn').onclick=loadTx;socket.on('transactions',rows=>{$('tx').innerHTML=rows.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</td><td>${x.turn}월</td><td>${x.nickname}</td><td>${x.country}</td><td>${x.stock}</td><td>${x.action==='buy'?'매수':'매도'}</td><td>${x.quantity}</td><td>${money(x.price)}</td><td>${money(x.value)}</td></tr>`).join('')||'<tr><td colspan="9" class="muted">거래내역 없음</td></tr>')});socket.on('newTransaction',()=>loadTx());
$('next').onclick=()=>{if(confirm('다음 턴으로 진행할까요?'))socket.emit('adminAction',{action:'nextTurn'})};$('pause').onclick=()=>socket.emit('adminAction',{action:'pause'});$('resume').onclick=()=>socket.emit('adminAction',{action:'resume'});$('reset').onclick=()=>{if(confirm('모든 참가자와 거래기록을 초기화할까요?'))socket.emit('adminAction',{action:'reset'})};
</script>
</body></html>
